<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Threat Modelling Scorecard</title>
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom styles (override Bootstrap where needed) -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container ci-dark">
        <header>
            <div class="header-top">
                <h1>AI Agent Threat Modelling Scorecard</h1>
                <div class="header-actions">
                    <button class="btn btn-outline-light" id="resetBtn">Reset</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Score Summary Section -->
            <div class="score-summary row">
                <div class="card summary-card col-12 col-md-6">
                    <div class="card-body p-3">
                        <div class="summary-label">Total Score</div>
                        <div class="summary-value" id="totalScore">0</div>
                    </div>
                </div>
                <div class="card summary-card col-12 col-md-6">
                    <div class="card-body p-3">
                        <div class="summary-label">Risk Tier</div>
                        <div class="risk-tier-display" id="riskTierDisplay">
                            <span class="tier-badge unknown" id="tierBadge">UNKNOWN</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress Bar Section -->
            <div class="progress-section">
                <div class="progress-container">
                    <div class="progress-labels">
                        <span class="label-left">0</span>
                        <span class="label-center-left">Low</span>
                        <span class="label-center">Moderate</span>
                        <span class="label-center-right">High</span>
                        <span class="label-right" id="maxScoreLabel">23</span>
                    </div>
                    <div class="progress-bar-outer">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                    </div>
                </div>
                <div class="risk-message" id="riskMessage">No assessment yet — adjust the sliders to calculate risk.</div>
            </div>

            <!-- Categories Section -->
            <form id="assessmentForm" class="assessment-form">
                <h2 class="section-title">Category Scores</h2>
                
                <div class="categories-container" id="categoriesContainer">
                    <!-- Categories will be generated by JavaScript -->
                </div>
                <div class="action-buttons d-flex justify-content-center mt-3">
                    <button type="reset" class="btn btn-outline-light me-2">Reset</button>
                    <button type="button" class="btn btn-primary" id="saveBtn">Save Assessment</button>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Code Institute.</p><p> Security recommendations based on Gen AI Security Project and <a target="_blank" href="https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/">OWASP Top 10 for Agentic Applications 2026</a></p></p>
        </footer>
    </div>

    <script src="assets/js/script.js"></script>
    <!-- Bootstrap Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
